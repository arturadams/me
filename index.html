<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Artur Adams | Fullstack Developer</title>

  <!-- SEO -->
  <meta name="description" content="Artur Adams — Fullstack Developer crafting polished, high-performance digital experiences.">
  <meta name="keywords" content="Artur Adams, Artur Gehlen Adams, Fullstack Developer, Software Engineer, Portfolio, artur.cool, TypeScript, React, next, tailwind, tailwindcss, BTP, SAP, n8n">
  <meta name="author" content="Artur Adams">
  <meta name="robots" content="index,follow">

  <!-- Social -->
  <meta property="og:title" content="Artur Adams | Fullstack Developer">
  <meta property="og:description" content="Contact page for Artur Adams.">
  <meta property="og:url" content="https://artur.cool">
  <meta property="og:type" content="website">

  <!-- Favicon -->
  <link rel="icon" href="/favicon.ico" />
  <meta name="theme-color" content="#0b0f1a">

  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Artur Adams",
    "url": "https://artur.cool",
    "jobTitle": "Fullstack Developer",
    "sameAs": [
      "https://linkedin.com/in/arturadams",
      "https://github.com/arturadams"
    ]
  }
  </script>

  <style>
  :root {
    --bg1:#0b0f1a;
    --bg2:#111827;
    --frost:rgba(255,255,255,0.08);
    --border:rgba(255,255,255,0.25);
    --accent:#23d6ff;
    --text:#e6f9ff;
    --blur:16px;
    font-family:"Inter","Segoe UI",sans-serif;
  }

  html {
    scroll-behavior:smooth;
    text-rendering:optimizeLegibility;
    -webkit-font-smoothing:antialiased;
  }

  *{box-sizing:border-box;margin:0;padding:0}

  body {
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:radial-gradient(circle at 20% 20%,var(--bg2),var(--bg1));
    color:var(--text);
    overflow:hidden;
    user-select:none;
  }

  body::before,body::after {
    content:"";
    position:absolute;
    inset:0;
    background:conic-gradient(from 180deg at 50% 50%,
      rgba(35,214,255,0.05),
      rgba(35,214,255,0.1),
      rgba(255,255,255,0.05),
      rgba(35,214,255,0.1),
      rgba(35,214,255,0.05));
    mix-blend-mode:screen;
    animation:waveMove 20s linear infinite;
    opacity:.6;
  }
  body::after {animation-direction:reverse;filter:blur(60px) brightness(1.4);}
  @keyframes waveMove {0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}

  /* Titles */
  h1 {
    font-size:3.4rem;
    font-weight:700;
    letter-spacing:2px;
    background:linear-gradient(120deg,
      rgba(255,255,255,0.15)0%,
      rgba(255,255,255,0.5)10%,
      rgba(35,214,255,0.8)20%,
      rgba(255,255,255,0.5)30%,
      rgba(255,255,255,0.15)50%)0 0/200%100%,
      linear-gradient(90deg,#7FDBFF,#23D6FF,#E6F9FF);
    background-blend-mode:screen;
    background-size:200%100%;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:auroraSweep 6s ease-in-out infinite alternate,pulseGlow 4s ease-in-out infinite;
    text-shadow:0 0 20px rgba(35,214,255,0.15);
    z-index:1;
    text-align:center;
  }
  @keyframes auroraSweep {from{background-position:200% 50%,0 50%}to{background-position:0% 50%,100% 50%}}
  @keyframes pulseGlow {0%,100%{text-shadow:0 0 15px rgba(35,214,255,0.2)}50%{text-shadow:0 0 35px rgba(35,214,255,0.35)}}

  h2 {
    font-weight:300;
    letter-spacing:3px;
    opacity:.85;
    margin-top:.4rem;
    font-size:1.1rem;
    z-index:1;
    text-align:center;
  }

  .buttons {
    margin-top:2.5rem;
    display:flex;
    gap:1.5rem;
    flex-wrap:wrap;
    justify-content:center;
    z-index:1;
  }

  /* Buttons */
  .cool-btn {
    position:relative;
    display:flex;
    align-items:center;
    gap:.6rem;
    padding:.9rem 1.9rem;
    border-radius:14px;
    border:1px solid var(--border);
    background:linear-gradient(180deg,rgba(255,255,255,0.08),rgba(255,255,255,0.03));
    backdrop-filter:blur(var(--blur));
    -webkit-backdrop-filter:blur(var(--blur));
    color:var(--text);
    font-weight:500;
    text-decoration:none;
    letter-spacing:.4px;
    overflow:hidden;
    transition:all .4s cubic-bezier(.25,.1,.25,1);
    opacity:0;
    transform:translateY(20px);
    animation:riseIn 1s ease forwards;
    will-change:transform,box-shadow;
  }
  .cool-btn:nth-child(1){animation-delay:.4s}
  .cool-btn:nth-child(2){animation-delay:.6s}
  .cool-btn:nth-child(3){animation-delay:.8s}
  @keyframes riseIn {to{opacity:1;transform:translateY(0)}}

  .cool-btn::after {
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(180deg,rgba(255,255,255,0.05),transparent 60%);
    border-radius:inherit;
    pointer-events:none;
  }

  .cool-btn::before {
    content:"";
    position:absolute;
    top:0;left:-150%;
    width:200%;
    height:100%;
    background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,0.25) 50%,transparent 70%);
    transition:transform 1s cubic-bezier(.25,.1,.25,1),opacity .5s ease;
    opacity:0;
  }
  .cool-btn:hover::before {transform:translateX(75%);opacity:1;}

  .cool-btn:hover {
    border-color:rgba(35,214,255,0.6);
    box-shadow:0 0 18px rgba(35,214,255,0.25);
    background:rgba(255,255,255,0.12);
    transform:translateY(-3px);
  }

  .cool-btn:focus-visible {
    outline:2px solid var(--accent);
    outline-offset:3px;
  }

  .cool-btn svg {
    width:22px;
    height:22px;
    color:#d9f7ff;
    fill:currentColor;
    opacity:.9;
    filter:drop-shadow(0 0 2px rgba(35,214,255,0.2));
    transition:opacity .4s ease;
  }
  .cool-btn:hover svg {opacity:1;}

  .footer-watermark {
    position:absolute;
    bottom:1.2rem;
    font-size:.9rem;
    letter-spacing:2px;
    opacity:.25;
    animation:floatFade 5s ease-in-out infinite alternate;
  }
  @keyframes floatFade {0%{transform:translateY(0);opacity:.25}100%{transform:translateY(-6px);opacity:.45}}

  @media(max-width:480px){
    h1{font-size:2.2rem}
    h2{font-size:1rem}
    .cool-btn{padding:.8rem 1.3rem}
  }
  </style>
</head>

<body>

  <h2>Fullstack Developer</h2>

    <a href="https://linkedin.com/in/arturadams" target="_blank" rel="noopener" class="cool-btn" aria-label="LinkedIn profile" role="button">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
        <path d="M4.98 3.5A2.5 2.5 0 1 1 0 3.5a2.5 2.5 0 0 1 4.98 0ZM.5 8.5h4.96v15H.5v-15ZM8.48 8.5h4.75v2.2h.07c.66-1.24 2.27-2.54 4.68-2.54 5 0 5.93 3.29 5.93 7.57v8.77h-4.96v-7.77c0-1.85-.03-4.24-2.58-4.24-2.58 0-2.98 2.01-2.98 4.1v7.9H8.48v-16Z"/>
      </svg>
      LinkedIn
    </a>
  </div>

  <div class="footer-watermark">artur.cool</div>
</body>
</html>
